<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Tidewater — WebGPU Ocean</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="/src/ui/ui.css" />
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
		#app, #app canvas { display: block; }
		#fps { position: fixed; top: 10px; left: 12px; z-index: 50; font: 500 12px/1.2 'JetBrains Mono', ui-monospace, monospace;
			color: #e8f6ff; background: rgba(8, 14, 22, 0.55); padding: 5px 9px; border-radius: 6px; pointer-events: none;
			backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); letter-spacing: 0.02em; }
	</style>
</head>
<body>
	<div id="app"></div>
	<div id="fps">-- fps</div>
	<div id="loader">
		<div class="loader-inner">
			<div class="loader-title">TIDEWATER</div>
			<div class="loader-sub">WebGPU ocean simulation</div>
			<div class="loader-bar"><div class="loader-fill"></div></div>
			<div class="loader-status">Initializing…</div>
		</div>
	</div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
